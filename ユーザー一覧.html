<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>GitHub ユーザー検索</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="min-h-screen flex items-center justify-center bg-sky-100 p-4">
    <div class="bg-white rounded-lg shadow p-8 w-full max-w-md">
      <h1 class="text-xl font-bold mb-6 text-gray-800">GitHub ユーザー検索</h1>

      <div class="flex gap-2 mb-4">
        <input
          type="text"
          id="username"
          placeholder="例: octocat"
          class="flex-1 border rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-400"
        >
        <button
          id="searchBtn"
          class="bg-blue-600 text-white font-bold px-4 py-2 rounded hover:bg-blue-700 disabled:opacity-50"
        >
          検索
        </button>
      </div>

      <p id="message" class="text-sm font-medium text-red-500 mb-4 hidden"></p>

      <div id="result" class="hidden text-center">
        <img id="avatar" class="w-24 h-24 rounded-full mx-auto mb-4 border-4 border-sky-200" alt="avatar">
        <h2 id="name" class="text-lg font-bold text-gray-800"></h2>
        <p id="bio" class="text-sm text-gray-500 mt-1"></p>
        <p id="followers" class="text-sm font-medium text-blue-600 mt-3"></p>
      </div>
    </div>

    <script>
      const usernameInput = document.getElementById("username");
      const searchBtn = document.getElementById("searchBtn");
      const message = document.getElementById("message");
      const result = document.getElementById("result");
      const avatar = document.getElementById("avatar");
      const nameEl = document.getElementById("name");
      const bioEl = document.getElementById("bio");
      const followersEl = document.getElementById("followers");

      function showMessage(text) {
        message.textContent = text;
        message.classList.remove("hidden");
        result.classList.add("hidden");
      }

      function clearMessage() {
        message.textContent = "";
        message.classList.add("hidden");
      }

      async function searchUser() {
        const username = usernameInput.value.trim();

        if (username === "") {
          showMessage("ユーザー名を入力してください");
          return;
        }

        clearMessage();
        searchBtn.disabled = true;
        searchBtn.textContent = "検索中...";

        try {
          const response = await fetch(`https://api.github.com/users/${username}`);

          if (!response.ok) {
            showMessage("ユーザーが見つかりませんでした");
            return;
          }

          const data = await response.json();

          avatar.src = data.avatar_url;
          nameEl.textContent = data.name || username;
          bioEl.textContent = data.bio || "（bioは設定されていません）";
          followersEl.textContent = `フォロワー数: ${data.followers}`;

          result.classList.remove("hidden");
        } catch (error) {
          showMessage("通信中にエラーが発生しました");
        } finally {
          searchBtn.disabled = false;
          searchBtn.textContent = "検索";
        }
      }

      searchBtn.addEventListener("click", searchUser);
      usernameInput.addEventListener("keydown", (event) => {
        if (event.key === "Enter") searchUser();
      });

    </script>
  </body>
</html>
